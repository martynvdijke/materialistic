apply plugin: 'com.android.application'
apply plugin: 'com.android.legacy-kapt'

android {
    compileSdk = 36

    defaultConfig {
        applicationId = "io.github.hidroh.materialistic"
        minSdk = 23
        targetSdk = 36
        versionCode = 79
        versionName = "3.3"
        buildConfigField "int", "LATEST_RELEASE", "77"
        buildConfigField "String", "GITHUB_TOKEN", "\"\""
        buildConfigField "String", "MERCURY_TOKEN", "\"\""
        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro',
                'proguard-square.pro',
                'proguard-support.pro',
                'proguard-rx.pro'
        resConfigs 'en', 'zh-rCN', 'es'
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        debug {
            minifyEnabled = false
        }
        release {
            minifyEnabled = true
            shrinkResources = true
        }
    }
    lint {
        htmlReport = false
        xmlReport = false
        textReport = true
        lintConfig = file("${rootProject.getRootDir()}/lint.xml")
        abortOnError = true
        explainIssues = false
        absolutePaths = false
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }
    namespace = 'io.github.hidroh.materialistic'

}

ext {
    okHttpVersion = '5.4.0'
    daggerVersion = '1.2.5'
    retrofitVersion = '3.0.0'
    roomVersion = '2.8.5'
    lifecycleVersion = '2.11.0'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0',
            'androidx.recyclerview:recyclerview:1.4.0',
            'androidx.cardview:cardview:1.0.0',
            'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0',
            'com.google.android.material:material:1.14.0',
            'androidx.preference:preference:1.2.1',
            'androidx.browser:browser:1.10.0',
            'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0',
            "com.squareup.dagger:dagger:$daggerVersion",
            "com.squareup.retrofit2:retrofit:$retrofitVersion",
            "com.squareup.retrofit2:converter-gson:$retrofitVersion",
            "com.squareup.retrofit2:adapter-rxjava:$retrofitVersion",
            "com.squareup.okhttp3:okhttp:$okHttpVersion",
            "com.squareup.okhttp3:logging-interceptor:$okHttpVersion",
            "io.reactivex:rxandroid:1.2.1",
            'io.reactivex:rxjava:1.3.8',
            "androidx.room:room-runtime:$roomVersion",
            "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycleVersion",
            "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycleVersion"

    kapt "androidx.room:room-compiler:$roomVersion",
            "com.squareup.dagger:dagger-compiler:$daggerVersion"
    kaptTest "androidx.room:room-compiler:$roomVersion",
            "com.squareup.dagger:dagger-compiler:$daggerVersion"
}
